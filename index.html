<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project 8 | Container App</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 28px; color: #e7eefb; background: radial-gradient(ellipse at 50% 10%, #1a3b62 0, #101a2d 45%, #0b1220 100%); }
    main { width: min(680px, 100%); padding: 44px; border: 1px solid #334b6e; border-radius: 22px; background: rgba(15, 27, 46, .92); box-shadow: 0 28px 80px #03071288; }
    .tag { display: inline-flex; gap: 9px; align-items: center; padding: 7px 12px; border: 1px solid #285e53; border-radius: 99px; color: #9af0ce; background: #10382f; font-size: 13px; font-weight: 650; letter-spacing: .03em; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #49dda5; box-shadow: 0 0 12px #49dda588; }
    h1 { margin: 24px 0 10px; font-size: clamp(32px, 6vw, 48px); line-height: 1.08; letter-spacing: -.04em; }
    p { margin: 0; color: #acbbd1; font-size: 17px; line-height: 1.65; }
    .details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 30px; }
    .detail { padding: 15px 17px; border: 1px solid #2a3d59; border-radius: 12px; background: #101c30; }
    .label { display: block; margin-bottom: 5px; color: #8196b4; font-size: 12px; text-transform: uppercase; letter-spacing: .09em; }
    .value { font-size: 14px; font-weight: 600; }
    @media (max-width: 520px) { main { padding: 30px 24px; } .details { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <span class="tag"><span class="dot"></span> RUNNING IN A CONTAINER</span>
    <h1>Project 8: Docker App</h1>
    <p>A lightweight web app served from a Docker container. The image is built from a Dockerfile, and the server runs as a non-root user.</p>
    <section class="details" aria-label="Container details">
      <div class="detail"><span class="label">Runtime</span><span class="value">Python HTTP server</span></div>
      <div class="detail"><span class="label">Container port</span><span class="value">8000</span></div>
      <div class="detail"><span class="label">Image base</span><span class="value">Python 3.13 Alpine</span></div>
      <div class="detail"><span class="label">Mode</span><span class="value">Local Docker</span></div>
    </section>
  </main>
</body>
</html>
